[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-dapa"
version = "0.5.0"
description = "Multi-Robot Data Animation & Plotting Assistance"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
all = ["ffmpeg-python"]
docs = ["sphinx>=7.0", "furo>=2023.0", "sphinx-gallery>=0.14"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["mr_dapa"]

[tool.coverage.report]
show_missing = true
skip_empty = true
