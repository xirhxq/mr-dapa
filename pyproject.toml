[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-dapa"
version = "0.2.0"
description = "Multi-Robot Data Animation & Plotting Assistance"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
all = ["ffmpeg-python"]

[tool.ruff]
target-version = "py39"
line-length = 120
